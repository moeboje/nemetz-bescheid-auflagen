services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portalpw
      POSTGRES_DB: portaldev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portaldev"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://portal:portalpw@postgres:5432/portaldev?schema=public
      APP_ORIGIN: http://localhost:8080
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-with-long-random-secret}
      NODE_ENV: production
      RESET_TOKEN_TTL_MINUTES: 30
      SESSION_TTL_DAYS: 7
      COOKIE_SECURE: "false"
      BASE_PATH: /api
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
    volumes:
      - api_outbox:/app/apps/api/storage/mail-outbox
    networks:
      default:
        aliases:
          - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    networks:
      default:
        aliases:
          - web

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - web
    ports:
      - "8080:80"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  api_outbox:
